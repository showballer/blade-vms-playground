# Install in /etc/nginx/conf.d/bladevms.conf (inside nginx's http context).
upstream bladevms_web {
    server 127.0.0.1:3210;
    keepalive 16;
}

# Port 3000 is the canonical origin configured in APP_ORIGIN.
# Keep this redirect fixed; do not construct its destination from client Host.
server {
    listen 80;
    server_name 115.190.201.41;
    server_tokens off;
    access_log /var/log/nginx/bladevms-access.log;
    error_log /var/log/nginx/bladevms-error.log warn;
    return 308 http://115.190.201.41:3000$request_uri;
}

server {
    listen 3000;
    server_name 115.190.201.41;
    server_tokens off;
    access_log /var/log/nginx/bladevms-access.log;
    error_log /var/log/nginx/bladevms-error.log warn;

    # App limits: 16 MiB XLSX / 128 MiB CSV or CSV.GZ.
    # Leave room above 128 MiB for request framing / multipart overhead.
    client_max_body_size 144m;
    client_body_timeout 200s;
    send_timeout 200s;

    location / {
        proxy_pass http://bladevms_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_send_timeout 200s;
        proxy_read_timeout 200s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
    }
}
