name: Windows x64 full installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-full.yml'
      - 'apps/desktop/**'
      - 'packages/ui/**'
      - 'services/acquisition/**'
      - 'vendor/polytec/**'
      - 'scripts/*windows*'
      - 'scripts/test-field-service.cjs'
      - 'scripts/test-field-window.cjs'
      - 'scripts/field-waveform-smoke.cjs'
      - 'scripts/test-local-auth.cjs'
      - 'scripts/test-unified-auth.cjs'
      - 'scripts/test-field-account-bridge.cjs'
      - 'scripts/test-field-cloud-sync.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'WINDOWS_TEST_GUIDE.md'

permissions:
  contents: read

concurrency:
  group: windows-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Read desktop release version
        id: desktop
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid desktop release version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: services/acquisition/requirements*.txt
      - name: Install frontend build dependencies
        run: npm ci
      - name: Unit tests and type checks
        run: |
          npm run test:field
          if ($LASTEXITCODE -ne 0) { throw 'Field unit tests failed' }
          npm run test:single-point:ui
          if ($LASTEXITCODE -ne 0) { throw 'Single-point and motion-trial UI tests failed' }
          npm run test:auto-follow
          if ($LASTEXITCODE -ne 0) { throw 'Automatic station planning, production UI and blade summary tests failed' }
          npx tsx scripts/test-web-blade-capture-selection.ts
          if ($LASTEXITCODE -ne 0) { throw 'Blade record selection and preparation cancellation tests failed' }
          node scripts/test-field-capture-main.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Single-point capture bridge tests failed' }
          node --test scripts/test-windows-blade-passes-gate.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Blade pass package gate contract tests failed' }
          node --test scripts/test-windows-motion-trial-gate.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Frozen motion-trial gate contract tests failed' }
          node --test scripts/test-windows-packaged-bridge.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Packaged bridge integrity tests failed' }
          npm run test:unified-auth
          if ($LASTEXITCODE -ne 0) { throw 'Unified account tests failed' }
          npm run test:field-cloud-sync
          if ($LASTEXITCODE -ne 0) { throw 'Cloud sync queue tests failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Type checks failed' }
      - name: Build frozen Python service with supplied x64 SDK
        run: ./services/acquisition/build-windows.ps1 -SdkDirectory "$pwd/vendor/polytec/x64" -StageDesktop
      - name: Prepare verified Microsoft runtime
        run: ./scripts/prepare-windows-prerequisites.ps1
      - name: Build complete Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:windows
      - name: Verify packaged simulation, realtime analysis and complete CSV export
        run: |
          node scripts/test-windows-simulation.cjs --resources apps/desktop/release/win-unpacked/resources
          if ($LASTEXITCODE -ne 0) { throw 'Frozen simulation and export verification failed' }
      - name: Verify frozen full-circle planner without hardware and reject unavailable execution
        run: |
          node scripts/test-windows-motion-trial.cjs --resources apps/desktop/release/win-unpacked/resources
          if ($LASTEXITCODE -ne 0) { throw 'Frozen motion-trial preview and arm-rejection verification failed' }
      - name: Verify packaged blade point records, CSV export and Web pass analysis without hardware
        run: |
          node scripts/test-windows-blade-passes.cjs --resources apps/desktop/release/win-unpacked/resources
          if ($LASTEXITCODE -ne 0) { throw 'Frozen blade point export and synchronization verification failed' }
      - name: Verify current-point selection and manual next-point workflow
        run: |
          npx electron scripts/auto-follow-ui-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Automatic following UI interaction checks failed' }
      - name: Verify waveform and device configuration UI without hardware
        run: npm run test:field-waveform
      - name: Verify frozen runtime, install, login, coexistence and uninstall
        run: node scripts/test-windows-bundle.cjs --resources apps/desktop/release/win-unpacked/resources --installer apps/desktop/release/BladeVMS-Setup-${{ steps.desktop.outputs.version }}-x64.exe
      - name: Record package checksums
        run: |
          Get-ChildItem apps/desktop/release -File | Where-Object { $_.Extension -in '.exe', '.zip' } | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content -Encoding utf8NoBOM apps/desktop/release/SHA256SUMS.txt
          Copy-Item WINDOWS_TEST_GUIDE.md apps/desktop/release/
          Copy-Item CLOUD_CAPTURE_FLOW.md apps/desktop/release/
          Copy-Item docs/AUTOMATIC_FOLLOWING.md apps/desktop/release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BladeVMS-${{ steps.desktop.outputs.version }}-windows-x64-full
          path: |
            apps/desktop/release/BladeVMS-Setup-${{ steps.desktop.outputs.version }}-x64.exe
            apps/desktop/release/BladeVMS-${{ steps.desktop.outputs.version }}-win.zip
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/WINDOWS_TEST_GUIDE.md
            apps/desktop/release/CLOUD_CAPTURE_FLOW.md
            apps/desktop/release/AUTOMATIC_FOLLOWING.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload hardware-free verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-verification-evidence
          path: |
            artifacts/windows-bundle-smoke/
            artifacts/windows-simulation-smoke/report.json
            artifacts/windows-motion-trial-smoke/report.json
            artifacts/field-waveform-smoke/
            artifacts/windows-blade-passes-smoke/
            artifacts/auto-follow-ui-review/result.json
            artifacts/auto-follow-ui-review/*.png
          if-no-files-found: warn
          retention-days: 30
